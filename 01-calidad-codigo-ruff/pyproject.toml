[project]
name = "practica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cristiandacontreras", email = "cristiancontreras33@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
practica = "practica:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH"]
